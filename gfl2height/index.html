<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GFL2 Height Chart</title>
<style>
:root {
	/* general */
	--version: "GL";
	--offset-display: true;
	--grid-display: true;
	--height-display: true;
	--label-display: true;
	--spacing-global: 140px;
	--spacing-global-min: 100px;
	--spacing-global-max: 500px;
	--spacing-img-min: 100px;
	--rotation-max: 8;
	--rotation-global: 1;
	--zoom-min: -2;
	--zoom-max: 5;
	--format: "cm";
	--px-per-cm: 3.491;
	--zero-y: 700px;
	--image-offset-y: 35.12px;
	--image-scale: 0.2;

	/* grid */
	--grid-cm: 20;
	--grid-thickness: 0.5px;

	/* height display */
	--height-line-width: 90px;
	--height-line-thickness: 1px;
	--height-display-offset: 30px;
	--extra-line-tick: 12px;   /* how far the blue (extra height) line goes up at its left edge */

	/* look */
	--ui-accent: #6ab0ff;   /* checkboxes and slider */
}

html, body {
	margin: 0;
	height: 100%;
	overflow: hidden;
	background: #14151a;
	user-select: none;           /* fast clicks must never select text */
	-webkit-user-select: none;
}
#ui button { touch-action: manipulation; }   /* no double-tap zoom on fast taps */

/* ---------- UI bar, always visible at the top ---------- */
#ui {
	position: fixed;
	top: 0;
	left: 0;
	right: 0;
	z-index: 100;
	display: flex;
	flex-wrap: wrap;           /* on small screens the groups wrap onto more rows */
	align-items: center;
	gap: 8px 12px;
	padding: 8px 12px;
	background: rgba(20, 21, 26, .9);
	border-bottom: 1px solid rgba(255, 255, 255, .15);
	font: 14px sans-serif;
	color: #eee;
}
#ui select,
#ui button {
	font: inherit;
	color: inherit;
	background: #23252d;
	border: 1px solid rgba(255, 255, 255, .25);
	border-radius: 4px;
	padding: 4px 8px;
}
#ui button { cursor: pointer; }
#ui button:hover { background: #2e3140; }
#ui .readout {
	text-align: right;
	font-variant-numeric: tabular-nums;
}
#ui #cursor-cm { min-width: 9ch; }
#ui #zoom-level { min-width: 4ch; }

/* a group (label + its control) always wraps as one piece */
#ui .group,
#ui .rotate,
#ui .spacing {
	display: flex;
	align-items: center;
	gap: 6px;
	white-space: nowrap;
}
#ui .group.right { margin-left: auto; gap: 12px; }   /* readouts stay at the right edge */

/* "Customize" dropdown */
#ui .dropdown { position: relative; }
#ui .dropdown .panel {
	display: none;
	position: absolute;
	top: calc(100% + 6px);
	left: 0;
	min-width: 160px;
	padding: 10px 12px;
	background: #23252d;
	border: 1px solid rgba(255, 255, 255, .25);
	border-radius: 4px;
	box-shadow: 0 4px 12px rgba(0, 0, 0, .4);
}
#ui .dropdown.open .panel { display: flex; flex-direction: column; gap: 8px; }
#ui .dropdown .panel .option {
	border: none;
	background: transparent;
	text-align: left;
	white-space: nowrap;
	padding: 4px 8px;
	margin: 0 -8px;
}
#ui .dropdown .panel .option:hover { background: #2e3140; }
#ui .dropdown .panel .option.active { background: rgba(255, 255, 255, .12); }
/* two-sided switch:  LEFT | label | RIGHT   (the active side is highlighted) */
#ui .switch {
	position: relative;
	display: flex;
	align-items: stretch;
	padding: 3px;
	border: 1px solid rgba(255, 255, 255, .12);
	border-radius: 4px;   /* same as the buttons and dropdowns */
	background: #181a20;
	cursor: pointer;
	white-space: nowrap;
	user-select: none;
	transition: border-color .15s ease;
}
#ui .switch:hover { border-color: rgba(255, 255, 255, .28); }
#ui .switch:focus-visible { outline: 2px solid var(--ui-accent); outline-offset: 2px; }

/* the sliding highlight; position and size are set by makeSwitch() */
#ui .switch .thumb {
	position: absolute;
	top: 3px;
	bottom: 3px;
	left: 0;
	width: 0;
	border-radius: 3px;
	background: linear-gradient(180deg, #8cc4ff, var(--ui-accent));
	box-shadow: inset 0 1px 0 rgba(255, 255, 255, .45);
	transition: transform .24s cubic-bezier(.3, .7, .2, 1), width .24s cubic-bezier(.3, .7, .2, 1),
	            background .2s ease, box-shadow .2s ease;
}
/* a switch whose left side means "off": the highlight turns grey there */
#ui .switch.dim-left:not(.on) .thumb {
	background: linear-gradient(180deg, #5b6172, #474c5b);
	box-shadow: inset 0 1px 0 rgba(255, 255, 255, .18);
}

#ui .switch .side,
#ui .switch .mid {
	position: relative;   /* above the thumb */
	z-index: 1;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 3px 12px;
}
#ui .switch .side {
	min-width: 2.4em;
	border-radius: 3px;
	color: #6f7686;
	font-weight: 600;
	letter-spacing: .04em;
	transition: color .2s ease;
}
#ui .switch .side:hover { color: #c5cad6; }
#ui .switch .mid { flex: 1; padding: 3px 14px; color: #e8eaf0; }
#ui .switch:not(.on) .left,
#ui .switch.on .right,
#ui .switch:not(.on) .left:hover,
#ui .switch.on .right:hover { color: #0b1a2e; }
#ui .switch.dim-left:not(.on) .left,
#ui .switch.dim-left:not(.on) .left:hover { color: #e8eaf0; }

/* "Spacing" slider */
#ui .spacing input[type="range"] {
	width: 140px;
	accent-color: var(--ui-accent);
	cursor: pointer;
}
#ui input[type="checkbox"] { accent-color: var(--ui-accent); cursor: pointer; }

/* ---------- image list: collapsible panel on the left ---------- */
#sidebar {
	position: fixed;
	left: 0;
	top: var(--ui-h, 44px);   /* below the UI bar, whatever height it wraps to */
	bottom: 0;
	width: max-content;   /* exactly as wide as the row of 3 buttons (the list does not count, see #img-list) */
	max-width: 92vw;
	z-index: 90;
	box-sizing: border-box;
	display: flex;
	flex-direction: column;
	gap: 8px;
	padding: 10px;
	background: rgba(20, 21, 26, .92);
	border-right: 1px solid rgba(255, 255, 255, .15);
	font: 14px sans-serif;
	color: #eee;
	transition: transform .18s ease;
}
#sidebar.collapsed { transform: translateX(-100%); }

/* the toggle sticks out of the panel's right edge, so it stays visible when collapsed */
#sidebar-toggle {
	position: absolute;
	top: 10px;
	left: 100%;
	width: 30px;
	border-left: none;
	border-radius: 0 4px 4px 0;
}

#sidebar button,
#sidebar input[type="search"] {
	font: inherit;
	color: inherit;
	background: #23252d;
	border: 1px solid rgba(255, 255, 255, .25);
	border-radius: 4px;
	padding: 4px 8px;
}
#sidebar button { cursor: pointer; touch-action: manipulation; }
#sidebar button:hover { background: #2e3140; }
#sidebar input[type="search"] { width: 100%; box-sizing: border-box; user-select: text; -webkit-user-select: text; }
#sidebar .sb-buttons { display: flex; flex-wrap: nowrap; gap: 6px; }
#sidebar .sb-buttons button { white-space: nowrap; }

/* width 0 + min-width 100%: the list fills the panel but never makes it wider */
#img-list { flex: 1; width: 0; min-width: 100%; overflow-y: auto; overflow-x: hidden; margin: 0 -4px; padding: 0 4px; box-sizing: content-box; }
#img-list .grp.filtered { display: none; }
#img-list label {
	display: flex;
	align-items: center;
	gap: 8px;
	padding: 2px 0;
	cursor: pointer;
	white-space: nowrap;
}
#img-list .grp-head {
	display: flex;
	align-items: center;
	gap: 6px;
	padding: 2px 0;
	font-weight: 600;
}
#img-list .grp-name { flex: 1; min-width: 0; }
#img-list .count {
	color: #8a90a0;
	font-size: 13px;
	font-weight: 400;
	font-variant-numeric: tabular-nums;
}

/* collapse arrow */
#img-list .chev,
#img-list .chev:hover {
	width: 18px;
	padding: 0;
	border: none;
	background: transparent;
	color: #8a90a0;
	font-size: 12px;
	line-height: 1;
}
#img-list .chev:hover { color: #eee; }
#img-list .chev { transition: transform .12s ease; }
#img-list .grp.collapsed .chev { transform: rotate(-90deg); }

/* items sit under a thin guide line */
#img-list .grp-items {
	margin: 0 0 6px 9px;
	padding-left: 28px;
	border-left: 1px solid rgba(255, 255, 255, .14);
}
#img-list .grp.collapsed .grp-items { display: none; }
#img-list input[type="checkbox"] { accent-color: var(--ui-accent); cursor: pointer; }

/* whole page area; layers are stacked inside it.
   --s / --tx / --ty = current view (scale and translation), set by the zoom code */
#chart {
	--s: 1;
	--tx: 0px;
	--ty: 0px;
	position: relative;
	height: 100vh;
	overflow: hidden;
	touch-action: none;
}

/* layer 1: grey grid, anchored to the green 0cm line, follows the zoom.
   It is a canvas drawn by drawGrid(): CSS gradients with fractional tile sizes skip or
   flicker lines in Firefox, the canvas puts every line on a whole device pixel. */
#grid {
	position: absolute;
	inset: 0;
	width: 100%;
	height: 100%;
}
#grid.hidden,
#zero-line.hidden { display: none; }

/* layer 2: green 0cm line, always spans the whole screen */
#zero-line {
	position: absolute;
	left: 0;
	right: 0;
	top: calc(var(--ty) + var(--zero-y) * var(--s));
	height: var(--grid-thickness);   /* constant on screen, not affected by zoom */
	background: rgba(60, 220, 100, .6);
}

/* layer 3: images. This layer is moved/scaled as a whole by the zoom. */
#images {
	position: absolute;
	left: 0;
	top: 0;
	width: 0;
	height: 0;
	transform-origin: 0 0;
	transform: translate(var(--tx), var(--ty)) scale(var(--s));
}
/* images stand above the line (bottom edge = line + --image-offset-y).
   hidden until loaded and sized, so they never show at full scale */
#images img {
	position: absolute;
	/* --img-offset = img.offset * --px-per-cm, set per image (0px when offsets are off) */
	top: calc(var(--zero-y) + var(--image-offset-y) + var(--img-offset, 0px));
	transform: translateY(-100%);
	visibility: hidden;
	pointer-events: none;   /* so dragging/panning also works over images */
	user-select: none;
	-webkit-user-drag: none;
}
#images img.ready { visibility: visible; }

/* layer 4: height info. This layer is NOT scaled as a whole: each .hline is positioned
   from its world coordinates (--x, --y, --w) with the zoom applied by hand, so the line
   thickness and the text size stay constant on screen. */
#heights,
#extras {
	position: absolute;
	inset: 0;
	pointer-events: none;
}
#heights .hline,
#extras .hline {
	position: absolute;
	left:  calc(var(--tx) + var(--x) * var(--s));
	top:   calc(var(--ty) + var(--y) * var(--s));
	width: calc(var(--w) * var(--s));
	height: 0;
}
#heights .hline .line {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	height: var(--height-line-thickness);   /* constant on screen, not affected by zoom */
	background: rgba(255, 140, 0, .5);
}
#heights .hline .label {
	position: absolute;
	right: 0;
	bottom: 3px;
	font: 14px sans-serif;
	font-variant-numeric: tabular-nums;
	white-space: nowrap;
	color: rgb(255, 150, 30);
}

/* layer 5: extra height (light blue). Same idea and same x position as layer 4, but the
   line goes up a little at its right end, with the text above it, aligned right:

                   text
                      |
         _____________|                                                       */
#extras .hline .line {
	position: absolute;
	left: 0;
	right: 0;
	top: 0;
	height: var(--height-line-thickness);
	background: rgba(130, 205, 255, .55);
}
#extras .hline .tick {
	position: absolute;
	right: 0;
	bottom: 0;
	width: var(--height-line-thickness);
	height: calc(var(--extra-line-tick) * var(--s));   /* scales with the zoom like the line width */
	background: rgba(130, 205, 255, .55);
}
#extras .hline .label {
	position: absolute;
	right: 0;
	bottom: calc(var(--extra-line-tick) * var(--s) + 3px);   /* sits on top of the tick */
	font: 14px sans-serif;
	font-variant-numeric: tabular-nums;
	white-space: nowrap;
	color: rgb(140, 210, 255);
}
</style>
</head>
<body>

<div id="ui">
	<div class="group">
		<span>Sort by</span>
		<div class="dropdown" id="sort-menu">
			<button class="dropdown-btn" id="sort-btn" type="button"></button>
			<div class="panel">
				<button class="option" type="button" data-value="height">Height</button>
				<button class="option" type="button" data-value="name">Name</button>
			</div>
		</div>
		<button id="sort-reverse" type="button"></button>
	</div>

	<div class="dropdown" id="customize">
		<button class="dropdown-btn" id="customize-btn" type="button">Customize ▾</button>
		<div class="panel">
			<div class="switch dim-left" id="switch-offset" role="switch" tabindex="0" aria-checked="false">
				<span class="side left">OFF</span>
				<span class="mid">Shoe offset</span>
				<span class="side right">ON</span>
			</div>
			<div class="switch" id="switch-version" role="switch" tabindex="0" aria-checked="false">
				<span class="side left">GL</span>
				<span class="mid">CN server dolls</span>
				<span class="side right">CH</span>
			</div>
			<div class="switch dim-left" id="switch-grid" role="switch" tabindex="0" aria-checked="false">
				<span class="side left">OFF</span>
				<span class="mid">Display grid</span>
				<span class="side right">ON</span>
			</div>
			<div class="switch dim-left" id="switch-height" role="switch" tabindex="0" aria-checked="false">
				<span class="side left">OFF</span>
				<span class="mid">Display height</span>
				<span class="side right">ON</span>
			</div>
		</div>
	</div>

	<div class="rotate">
		<button id="rotate-prev" type="button">&lt;</button>
		<span>Rotate</span>
		<button id="rotate-next" type="button">&gt;</button>
	</div>

	<label class="spacing">
		<span>Spacing</span>
		<input type="range" id="spacing-slider" step="1">
	</label>

	<div class="group right">
		<span id="cursor-cm" class="readout">—</span>
		<button id="zoom-reset" type="button">Reset</button>
		<span id="zoom-level" class="readout">100%</span>
	</div>
</div>

<div id="sidebar" class="collapsed">   <!-- hidden by default -->
	<button id="sidebar-toggle" type="button" title="Show / hide the image list">›</button>
	<input type="search" id="img-search" placeholder="Search…" autocomplete="off" spellcheck="false">
	<div class="sb-buttons">
		<button id="show-all" type="button">Show All</button>
		<button id="show-default" type="button">Show Default</button>
		<button id="hide-all" type="button">Hide All</button>
	</div>
	<div id="img-list"></div>
</div>

<div id="chart">
	<canvas id="grid"></canvas>
	<div id="zero-line"></div>
	<div id="images"></div>
	<div id="heights"></div>
	<div id="extras"></div>
</div>

<script>
// ---------- helpers: read CSS variables ----------
const rootStyle = getComputedStyle(document.documentElement);

function cssVar(name) {
	return rootStyle.getPropertyValue(name).trim().replace(/^["']|["']$/g, "");
}

// ---------- raw image data ----------
const rawImages = [
	{ src: "img/Igla Default",                        name: "Igla",        type: "Default",                   offset: 6.5,   height: 181.33, extra: 0,      spacing: "0px",  version: "CH" },
	{ src: "img/Igla Ardent Rose",                    name: "Igla",        type: "Ardent Rose",               offset: 10.44, height: 185.27, extra: 0,      spacing: "0px",  version: "CH" },
	{ src: "img/Igla Dorm",                           name: "Igla",        type: "Dorm",                      offset: 6.5,   height: 181.33, extra: 0,      spacing: "0px",  version: "CH" },
  //{ src: "img/Calibration",                         name: "Calibration", type: "Calibration",               offset: 0,     height: 200,    extra: 0,      spacing: "0px",  version: "CH" },
	{ src: "img/Colphne Default",                     name: "Colphne",     type: "Default",                   offset: 4.4,   height: 140.57, extra: 0,      spacing: "0px",  version: "GL" },
	{ src: "img/Colphne Dorm",                        name: "Colphne",     type: "Dorm",                      offset: 4.4,   height: 140.57, extra: 0,      spacing: "0px",  version: "GL" },
	{ src: "img/Colphne's Training Outfit",           name: "Colphne",     type: "Colphne's Training Outfit", offset: 4.4,   height: 140.57, extra: 0,      spacing: "0px",  version: "GL" },
	{ src: "img/Colphne Silent Heart",                name: "Colphne",     type: "Silent Heart",              offset: 4.4,   height: 140.63, extra: 0,      spacing: "0px",  version: "GL" },
	{ src: "img/Colphne Doppelganger Default",        name: "Colphne",     type: "Doppelganger Default",      offset: 4.4,   height: 140.57, extra: 0,      spacing: "0px",  version: "CH" },
	{ src: "img/Colphne Doppelganger Dorm",           name: "Colphne",     type: "Doppelganger Dorm",         offset: 4.4,   height: 140.57, extra: 0,      spacing: "0px",  version: "CH" },
	{ src: "img/Voymastina Default",                  name: "Voymastina",  type: "Default",                   offset: 6.5,   height: 181.05, extra: 0,      spacing: "0px",  version: "GL" },
	{ src: "img/Voymastina Dorm",                     name: "Voymastina",  type: "Dorm",                      offset: 6.5,   height: 181.05, extra: 0,      spacing: "0px",  version: "GL" },
	{ src: "img/Voymastina Erwin",                    name: "Voymastina",  type: "Erwin",                     offset: 2.75,  height: 177.29, extra: 0,      spacing: "0px",  version: "GL" }, 
	{ src: "img/Voymastina B-ROBO Voymawari",         name: "Voymastina",  type: "B-ROBO Voymawari",          offset: 2.6,   height: 177.15, extra: 0,      spacing: "0px",  version: "GL" }, 
	{ src: "img/Faelynn Default",                     name: "Faelynn",     type: "Default",                   offset: 10.26, height: 145.45, extra: 155.39, spacing: "0px",  version: "GL" }, 
	{ src: "img/Faelynn Dorm",                        name: "Faelynn",     type: "Dorm",                      offset: 4.7,   height: 139.85, extra: 149.79, spacing: "0px",  version: "GL" }, 
	{ src: "img/Faelynn Sunkissed Shimmer",           name: "Faelynn",     type: "Sunkissed Shimmer",         offset: 0,     height: 135.15, extra: 145.09, spacing: "0px",  version: "GL" }, 
	{ src: "img/Klukai Default",                      name: "Klukai",      type: "Default",                   offset: 5.3,   height: 150.93, extra: 0,      spacing: "0px",  version: "GL" }, 
	{ src: "img/Klukai Dorm",                         name: "Klukai",      type: "Dorm",                      offset: 5.3,   height: 150.93, extra: 0,      spacing: "0px",  version: "GL" }, 
	{ src: "img/Klukai Astral Luminous",              name: "Klukai",      type: "Astral Luminous",           offset: 5.3,   height: 150.71, extra: 0,      spacing: "0px",  version: "GL" }, 
	{ src: "img/Klukai Speed Star",                   name: "Klukai",      type: "Speed Star",                offset: 5.3,   height: 150.93, extra: 0,      spacing: "0px",  version: "GL" }, 
	{ src: "img/Klukai Cerulean Breaker",             name: "Klukai",      type: "Cerulean Breaker",          offset: 2.65,  height: 148.78, extra: 0,      spacing: "0px",  version: "GL" }, 
	{ src: "img/Klukai Indigo Oath",                  name: "Klukai",      type: "Indigo Oath",               offset: 5.3,   height: 151.35, extra: 0,      spacing: "0px",  version: "GL" }, 
	{ src: "img/Klukai Immaculate Service",           name: "Klukai",      type: "Immaculate Service",        offset: 5.3,   height: 151.15, extra: 0,      spacing: "0px",  version: "GL" }, 
];

// which images belong to the current --version:
// "GL" = only the GL images, "CH" = everything (GL + CH)
function versionAllows(img) {
	const v = cssVar("--version");
	return v === "CH" || img.version === v;
}

// ---------- final data: raw data + added properties ----------
const images = rawImages.map(img => ({
	...img,
	rotation:   parseFloat(cssVar("--rotation-global")),
	visibility: versionAllows(img),
}));

// ---------- sorting ----------
// height used for sorting: with or without offset, depending on --offset-display
function sortHeight(img) {
	return cssVar("--offset-display") === "true" ? img.height - img.offset : img.height;
}

// sorts `images` in place.
// by: "height" | "name"   ("name": by name first, then same names by height)
// descending: true = high -> low / Z -> A, false = low -> high / A -> Z
function sortImages(by = "height", descending = true) {
	const dir = descending ? -1 : 1;
	if (by === "name") {
		images.sort((a, b) => dir * (a.name.localeCompare(b.name) || sortHeight(a) - sortHeight(b)));
	} else {
		images.sort((a, b) => dir * (sortHeight(a) - sortHeight(b)));
	}
}

// ---------- display ----------
const imagesLayer = document.getElementById("images");
const elements = new Map();   // image data object -> its <img> element (created once)

// file name of an image for its current rotation, e.g. "img/Igla Default0001.webp"
function imageUrl(img) {
	return img.src + "000" + img.rotation + ".webp";
}

// each <img> is created once and kept, so sorting never reloads or resizes it
function createElements() {
	const scale = parseFloat(cssVar("--image-scale"));
	for (const img of images) {
		const el = document.createElement("img");
		// set the size first, show only after that (no flash at full scale)
		el.onload = () => {
			el.style.width = el.naturalWidth * scale + "px";
			el.classList.add("ready");
			renderImages();   // the width is known now, so the height lines can be centered
		};
		el.src = imageUrl(img);
		el.alt = img.name + " " + img.type;
		imagesLayer.appendChild(el);
		elements.set(img, el);
	}
}

// only places the existing elements, in the current sort order
function renderImages() {
	const spacingG   = parseFloat(cssVar("--spacing-global"));
	const spacingMin = parseFloat(cssVar("--spacing-img-min"));
	const pxPerCm    = parseFloat(cssVar("--px-per-cm"));
	const useOffset  = cssVar("--offset-display") === "true";

	const placed = [];   // visible images with their x position, for the height layer
	let x = 0;
	for (const img of images) {
		const el = elements.get(img);
		imagesLayer.appendChild(el);   // moves it, keeps stacking order = sort order
		el.style.display = img.visibility ? "" : "none";
		if (!img.visibility) continue;

		// with offsets on, the image is moved down by img.offset (cm -> px)
		el.style.setProperty("--img-offset", useOffset ? img.offset * pxPerCm + "px" : "0px");
		el.style.left = x + "px";
		placed.push({ img, el, x });
		// distance to the next image, never smaller than --spacing-img-min
		x += Math.max(spacingMin, spacingG + parseFloat(img.spacing));
	}

	renderHeights(placed);
	renderExtras(placed);
}

// current height of an image in cm: height, minus offset if --offset-display is true
function currentHeight(img) {
	return cssVar("--offset-display") === "true" ? img.height - img.offset : img.height;
}

// height info layer: an orange line + label at each image's height.
// Rebuilt together with the images, so sorting/offset changes update it too.
function renderHeights(placed) {
	const layer = document.getElementById("heights");
	layer.innerHTML = "";
	layer.style.display = cssVar("--height-display") === "true" ? "" : "none";

	const zeroY    = parseFloat(cssVar("--zero-y"));
	const pxPerCm  = parseFloat(cssVar("--px-per-cm"));
	const width    = parseFloat(cssVar("--height-line-width"));
	const shiftX  = parseFloat(cssVar("--height-display-offset"));
	const format   = cssVar("--format");

	for (const { img, el, x } of placed) {
		const cm    = currentHeight(img);
		const center = x + el.offsetWidth / 2;   // centered on the image

		const hline = document.createElement("div");
		hline.className = "hline";
		// world coordinates; the CSS applies the zoom/pan (see #heights .hline)
		hline.style.setProperty("--x", center - width / 2 + shiftX + "px");   // + offset to the right
		hline.style.setProperty("--y", zeroY - cm * pxPerCm + "px");
		hline.style.setProperty("--w", width + "px");

		const line = document.createElement("div");
		line.className = "line";

		const label = document.createElement("div");
		label.className = "label";
		label.textContent = cm.toFixed(1) + " " + format;

		hline.append(line, label);
		layer.appendChild(hline);
	}
}

// extra height layer (light blue): only for images where img.extra is not 0.
// Works like renderHeights(): same offset rule, same width, same show/hide switch,
// and sits at exactly the same x position; only its shape differs (tick at the right end).
function currentExtra(img) {
	return cssVar("--offset-display") === "true" ? img.extra - img.offset : img.extra;
}

function renderExtras(placed) {
	const layer = document.getElementById("extras");
	layer.innerHTML = "";
	layer.style.display = cssVar("--height-display") === "true" ? "" : "none";

	const zeroY   = parseFloat(cssVar("--zero-y"));
	const pxPerCm = parseFloat(cssVar("--px-per-cm"));
	const width   = parseFloat(cssVar("--height-line-width"));
	const shiftX  = parseFloat(cssVar("--height-display-offset"));
	const format  = cssVar("--format");

	for (const { img, el, x } of placed) {
		if (!img.extra) continue;   // 0 = no extra height
		const cm     = currentExtra(img);
		const center = x + el.offsetWidth / 2;   // centered on the image

		const hline = document.createElement("div");
		hline.className = "hline";
		hline.style.setProperty("--x", center - width / 2 + shiftX + "px");   // exactly the same x as the orange line
		hline.style.setProperty("--y", zeroY - cm * pxPerCm + "px");
		hline.style.setProperty("--w", width + "px");

		const line = document.createElement("div");
		line.className = "line";

		const tick = document.createElement("div");
		tick.className = "tick";

		const label = document.createElement("div");
		label.className = "label";
		label.textContent = cm.toFixed(1) + " " + format;

		hline.append(line, tick, label);
		layer.appendChild(hline);
	}
}

// ---------- view: zoom ----------
// Photoshop-style: 100% is the default, the UI shows the real scale in percent.
//   --zoom-max : maximum scale as a multiple of 100%  (5 -> 500%)
//   --zoom-min : zoom-out step, scale = 1 / (1 - min / 2)
//                (-1 -> 66.67%, -2 -> 50%)
function minScale() { return 1 / (1 - parseFloat(cssVar("--zoom-min")) / 2); }
function maxScale() { return parseFloat(cssVar("--zoom-max")); }

const chart = document.getElementById("chart");
let scale = 1, tx = 0, ty = 0;    // zoom scale (1 = 100%) and translation (px) of the view
let mouse = null;                  // last cursor position

// ---------- grid (canvas) ----------
// vertical lines every --grid-cm * --px-per-cm * zoom, starting at the left edge of the
// world; horizontal lines start at the green 0cm line and repeat up and down.
// Every line is snapped to a whole device pixel so none are skipped while panning.
const gridCanvas = document.getElementById("grid");
const gridCtx    = gridCanvas.getContext("2d");
let gridKey = "";   // what was drawn last; skips redrawing when nothing changed

function drawGrid() {
	if (gridCanvas.classList.contains("hidden")) { gridKey = ""; return; }

	const dpr = window.devicePixelRatio || 1;
	const w   = chart.clientWidth;
	const h   = chart.clientHeight;
	const key = [w, h, dpr, tx, ty, scale, cssVar("--grid-cm"), cssVar("--px-per-cm"),
	             cssVar("--zero-y"), cssVar("--grid-thickness")].join("|");
	if (key === gridKey) return;
	gridKey = key;

	const bw = Math.round(w * dpr), bh = Math.round(h * dpr);
	if (gridCanvas.width !== bw || gridCanvas.height !== bh) {
		gridCanvas.width = bw;   // (also clears the canvas)
		gridCanvas.height = bh;
	}

	// work in device pixels
	const step  = parseFloat(cssVar("--grid-cm")) * parseFloat(cssVar("--px-per-cm")) * scale * dpr;
	const thick = Math.max(1, Math.round(parseFloat(cssVar("--grid-thickness")) * dpr));
	const x0    = tx * dpr;
	const y0    = (ty + parseFloat(cssVar("--zero-y")) * scale) * dpr;

	gridCtx.setTransform(1, 0, 0, 1, 0, 0);
	gridCtx.clearRect(0, 0, bw, bh);
	if (!(step > 2)) return;   // far too dense / invalid
	gridCtx.fillStyle = "rgba(255, 255, 255, .15)";

	for (let x = x0 + Math.ceil((0 - x0) / step) * step; x < bw; x += step) {
		gridCtx.fillRect(Math.round(x), 0, thick, bh);
	}
	for (let y = y0 + Math.ceil((0 - y0) / step) * step; y < bh; y += step) {
		gridCtx.fillRect(0, Math.round(y), bw, thick);
	}
}
new ResizeObserver(drawGrid).observe(chart);
window.addEventListener("resize", drawGrid);   // also fires when the browser zoom (dpr) changes

function applyView() {
	chart.style.setProperty("--s", scale);
	chart.style.setProperty("--tx", tx + "px");
	chart.style.setProperty("--ty", ty + "px");
	drawGrid();

	document.getElementById("zoom-level").textContent = Math.round(scale * 100) + "%";
	updateCursorReadout();
}

// sets a new scale, keeping the point (px, py) on screen fixed
function zoomAt(newScale, px, py) {
	newScale = Math.min(maxScale(), Math.max(minScale(), newScale));

	const wx = (px - tx) / scale;   // world point under (px, py)
	const wy = (py - ty) / scale;
	scale = newScale;
	tx = px - wx * scale;
	ty = py - wy * scale;
	applyView();
}

function resetView() {
	scale = 1; tx = 0; ty = 0;
	applyView();
}

// distance of the cursor from the green line, in cm (above the line = positive)
function updateCursorReadout() {
	const el = document.getElementById("cursor-cm");
	if (!mouse) { el.textContent = "—"; return; }
	const worldY = (mouse.y - ty) / scale;
	// only shown above the green line; below it is capped to 0
	const cm = Math.max(0, (parseFloat(cssVar("--zero-y")) - worldY) / parseFloat(cssVar("--px-per-cm")));
	el.textContent = cm.toFixed(1) + " " + cssVar("--format");
}

// mouse wheel (also trackpad pinch, which arrives as ctrl + wheel)
chart.addEventListener("wheel", e => {
	e.preventDefault();
	const d = e.deltaY * (e.deltaMode === 1 ? 16 : 1);
	zoomAt(scale * Math.exp(-d * 0.002), e.clientX, e.clientY);
}, { passive: false });

// pinch on touch screens
let pinchDist = 0;
function touchInfo(e) {
	const a = e.touches[0], b = e.touches[1];
	return {
		dist: Math.hypot(a.clientX - b.clientX, a.clientY - b.clientY),
		x: (a.clientX + b.clientX) / 2,
		y: (a.clientY + b.clientY) / 2,
	};
}
chart.addEventListener("touchstart", e => {
	if (e.touches.length === 2) pinchDist = touchInfo(e).dist;
}, { passive: true });
chart.addEventListener("touchmove", e => {
	if (e.touches.length !== 2) return;
	e.preventDefault();
	const t = touchInfo(e);
	if (pinchDist > 0) {
		zoomAt(scale * t.dist / pinchDist, t.x, t.y);
	}
	pinchDist = t.dist;
}, { passive: false });
chart.addEventListener("touchend", e => {
	if (e.touches.length < 2) pinchDist = 0;
});

// pan: drag with the mouse or one finger (two fingers = pinch zoom, no pan)
const pointers = new Map();   // active pointers: id -> last position

chart.addEventListener("pointerdown", e => {
	if (e.pointerType === "mouse" && e.button !== 0) return;
	pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
	chart.setPointerCapture(e.pointerId);
});

chart.addEventListener("pointermove", e => {
	mouse = { x: e.clientX, y: e.clientY };

	let prev = pointers.get(e.pointerId);
	// the mouse button is not held any more, but we missed the release: drop the stale drag
	if (prev && e.pointerType === "mouse" && e.buttons === 0) {
		pointers.delete(e.pointerId);
		prev = undefined;
	}
	if (prev) {
		if (pointers.size === 1) {
			tx += e.clientX - prev.x;
			ty += e.clientY - prev.y;
		}
		prev.x = e.clientX;
		prev.y = e.clientY;
	}
	applyView();   // also refreshes the cursor readout
});

function endPointer(e) {
	pointers.delete(e.pointerId);
}
chart.addEventListener("pointerup", endPointer);
chart.addEventListener("pointercancel", endPointer);
chart.addEventListener("lostpointercapture", endPointer);   // however the drag ended
window.addEventListener("blur", () => pointers.clear());

// fast clicking can select text or start a native drag, which interrupts our drag
chart.addEventListener("dragstart",   e => e.preventDefault());
chart.addEventListener("selectstart", e => e.preventDefault());

document.getElementById("zoom-reset").addEventListener("click", resetView);

// ---------- UI: sorting ----------
const sortBtn     = document.getElementById("sort-btn");
const sortOptions = document.querySelectorAll("#sort-menu .option");
const sortReverse = document.getElementById("sort-reverse");
let sortBy = "height";       // default sort option
let sortDescending = true;   // default order

function updateReverseButton() {
	sortReverse.textContent = sortDescending ? "↓" : "↑";
}

// the dropdown button always shows the current sort option
function updateSortButton() {
	for (const opt of sortOptions) {
		const active = opt.dataset.value === sortBy;
		opt.classList.toggle("active", active);
		if (active) sortBtn.textContent = opt.textContent + " ▾";
	}
}

function applySort() {
	sortImages(sortBy, sortDescending);
	renderImages();
}

for (const opt of sortOptions) {
	opt.addEventListener("click", () => {
		sortBy = opt.dataset.value;
		updateSortButton();
		opt.closest(".dropdown").classList.remove("open");
		applySort();
	});
}
sortReverse.addEventListener("click", () => {
	sortDescending = !sortDescending;
	updateReverseButton();
	applySort();
});

// ---------- UI: dropdowns (sort + customize) ----------
const dropdowns    = document.querySelectorAll("#ui .dropdown");

for (const dd of dropdowns) {
	dd.querySelector(".dropdown-btn").addEventListener("click", () => {
		const wasOpen = dd.classList.contains("open");
		dropdowns.forEach(d => d.classList.remove("open"));   // only one open at a time
		if (!wasOpen) dd.classList.add("open");
	});
}
// close when clicking anywhere else
document.addEventListener("pointerdown", e => {
	for (const dd of dropdowns) if (!dd.contains(e.target)) dd.classList.remove("open");
});

// ---------- UI: two-sided switches (in Customize) ----------
// el = the .switch element. A click on the left / right side picks that side, a click on
// the label in the middle flips it. onChange(isRight) is called when the side changes.
function makeSwitch(el, isRight, onChange) {
	let right = false;

	// the sliding highlight sits behind the active side
	const thumb = document.createElement("span");
	thumb.className = "thumb";
	el.prepend(thumb);
	function placeThumb() {
		const side = el.querySelector(right ? ".right" : ".left");
		if (!side.offsetWidth) return;   // not visible yet (panel closed)
		const first = !thumb.style.width;
		if (first) thumb.style.transition = "none";   // no slide-in on the very first placement
		thumb.style.width = side.offsetWidth + "px";
		thumb.style.transform = "translateX(" + side.offsetLeft + "px)";
		if (first) { thumb.offsetWidth; thumb.style.transition = ""; }
	}
	// also runs when the panel opens and the switch gets its size
	new ResizeObserver(placeThumb).observe(el);

	function set(value) {
		right = value;
		el.classList.toggle("on", right);
		el.setAttribute("aria-checked", String(right));
		placeThumb();
	}
	function pick(value) {
		if (value === right) return;
		set(value);
		onChange(right);
	}
	el.addEventListener("click", e => {
		if (e.target.closest(".left"))       pick(false);
		else if (e.target.closest(".right")) pick(true);
		else                                 pick(!right);
	});
	el.addEventListener("keydown", e => {
		if (e.key === " " || e.key === "Enter") { e.preventDefault(); pick(!right); }
	});
	set(isRight);   // initial state, no onChange
}

// OFF | Shoe offset | ON  -> --offset-display; heights change, so re-sort and redraw
makeSwitch(document.getElementById("switch-offset"), cssVar("--offset-display") === "true", on => {
	document.documentElement.style.setProperty("--offset-display", on ? "true" : "false");
	applySort();
});

// OFF | Display grid | ON  -> --grid-display: hides the grid and the green 0cm line
function applyGridDisplay() {
	const on = cssVar("--grid-display") === "true";
	document.getElementById("grid").classList.toggle("hidden", !on);
	document.getElementById("zero-line").classList.toggle("hidden", !on);
	drawGrid();   // draws it again after it was hidden
}
makeSwitch(document.getElementById("switch-grid"), cssVar("--grid-display") === "true", on => {
	document.documentElement.style.setProperty("--grid-display", on ? "true" : "false");
	applyGridDisplay();
});
applyGridDisplay();

// OFF | Display height | ON  -> --height-display: hides the orange lines and their text
makeSwitch(document.getElementById("switch-height"), cssVar("--height-display") === "true", on => {
	document.documentElement.style.setProperty("--height-display", on ? "true" : "false");
	document.getElementById("heights").style.display = on ? "" : "none";
	document.getElementById("extras").style.display  = on ? "" : "none";
});

// GL | CN server dolls | CH  -> --version
// GL: only the GL images (CH ones are not listed). CH: all images (GL + CH).
makeSwitch(document.getElementById("switch-version"), cssVar("--version") === "CH", ch => {
	document.documentElement.style.setProperty("--version", ch ? '"CH"' : '"GL"');
	rebuildList();
	setVisibilityAll(() => true);   // shows everything that this version allows
});

// ---------- UI: rotate ----------
// step = -1 or +1. Wraps around: below 1 -> --rotation-max, above --rotation-max -> 1
function rotateImages(step) {
	const max = parseInt(cssVar("--rotation-max"));
	for (const img of images) {
		let r = img.rotation + step;
		if (r < 1)   r = max;
		if (r > max) r = 1;
		img.rotation = r;
		elements.get(img).src = imageUrl(img);   // new file; onload re-renders when it is in
	}
	renderImages();
}

document.getElementById("rotate-prev").addEventListener("click", () => rotateImages(-1));
document.getElementById("rotate-next").addEventListener("click", () => rotateImages(+1));

// ---------- UI: spacing slider ----------
// ranges from --spacing-global-min to --spacing-global-max, starts at --spacing-global
const spacingSlider = document.getElementById("spacing-slider");
spacingSlider.min   = parseFloat(cssVar("--spacing-global-min"));
spacingSlider.max   = parseFloat(cssVar("--spacing-global-max"));
spacingSlider.value = parseFloat(cssVar("--spacing-global"));

spacingSlider.addEventListener("input", () => {
	document.documentElement.style.setProperty("--spacing-global", spacingSlider.value + "px");
	renderImages();   // re-places the images and the height lines with the new spacing
});

// ---------- UI: image list (left panel) ----------
// Lists every image grouped by name, then by type. The order only affects the list,
// not the images (the images use the sorting above).
const sidebar       = document.getElementById("sidebar");
const sidebarToggle = document.getElementById("sidebar-toggle");
const listEl        = document.getElementById("img-list");
const searchEl      = document.getElementById("img-search");
const listGroups    = [];   // { nameLower, el, cb, items: [{ img, cb }] }
const collapsedNames = new Set();   // groups the user collapsed (kept when the list is rebuilt)

function makeCheckbox(text) {
	const label = document.createElement("label");
	const cb = document.createElement("input");
	cb.type = "checkbox";
	const span = document.createElement("span");
	span.textContent = text;
	label.append(cb, span);
	return { label, cb };
}

function buildList() {
	const byName = new Map();
	for (const img of images.filter(versionAllows)) {   // other versions are not listed
		if (!byName.has(img.name)) byName.set(img.name, []);
		byName.get(img.name).push(img);
	}

	const frag = document.createDocumentFragment();
	for (const name of [...byName.keys()].sort((a, b) => a.localeCompare(b))) {
		const imgs = byName.get(name).sort((a, b) => a.type.localeCompare(b.type));

		const el   = document.createElement("div");
		el.className = "grp";
		const row  = document.createElement("div");
		row.className = "grp-head";
		const chev = document.createElement("button");
		chev.type = "button";
		chev.className = "chev";
		chev.textContent = "▾";
		chev.title = "Collapse / expand";
		const head = makeCheckbox(name);
		head.label.className = "grp-name";
		const count = document.createElement("span");   // shown / total
		count.className = "count";
		row.append(chev, head.label, count);
		const body = document.createElement("div");
		body.className = "grp-items";

		if (collapsedNames.has(name)) el.classList.add("collapsed");
		chev.addEventListener("click", () => {
			el.classList.toggle("collapsed");
			if (el.classList.contains("collapsed")) collapsedNames.add(name);
			else collapsedNames.delete(name);
		});

		const group = { nameLower: name.toLowerCase(), el, cb: head.cb, count, items: [] };

		// the group checkbox shows / hides every image of that name
		head.cb.addEventListener("change", () => {
			for (const img of imgs) img.visibility = head.cb.checked;
			syncList();
			renderImages();
		});

		for (const img of imgs) {
			const item = makeCheckbox(img.type);
			item.cb.addEventListener("change", () => {
				img.visibility = item.cb.checked;
				syncList();
				renderImages();
			});
			body.appendChild(item.label);
			group.items.push({ img, cb: item.cb });
		}

		el.append(row, body);
		frag.appendChild(el);
		listGroups.push(group);
	}
	listEl.appendChild(frag);
}

// makes the checkboxes match img.visibility (group: checked / partly / unchecked)
function syncList() {
	for (const g of listGroups) {
		let shown = 0;
		for (const item of g.items) {
			item.cb.checked = item.img.visibility;
			if (item.img.visibility) shown++;
		}
		g.cb.checked       = shown === g.items.length;
		g.cb.indeterminate = shown > 0 && shown < g.items.length;
		g.count.textContent = shown + "/" + g.items.length;
	}
}

// sets visibility of every image with fn(img) -> boolean
// (images of other versions stay hidden)
function setVisibilityAll(fn) {
	for (const img of images) img.visibility = versionAllows(img) && fn(img);
	syncList();
	renderImages();
}

document.getElementById("show-all").addEventListener("click",     () => setVisibilityAll(() => true));
document.getElementById("hide-all").addEventListener("click",     () => setVisibilityAll(() => false));
document.getElementById("show-default").addEventListener("click", () => setVisibilityAll(img => img.type.toLowerCase() === "default"));

// search: only whole groups (by img.name) are filtered; just toggles a class, so it is instant
function applySearch() {
	const q = searchEl.value.trim().toLowerCase();
	for (const g of listGroups) g.el.classList.toggle("filtered", q !== "" && !g.nameLower.includes(q));
}
searchEl.addEventListener("input", applySearch);

// rebuilds the list, e.g. after the version changed (keeps search text and collapsed groups)
function rebuildList() {
	listEl.innerHTML = "";
	listGroups.length = 0;
	buildList();
	syncList();
	applySearch();
}

// collapse / expand the panel
sidebarToggle.addEventListener("click", () => {
	sidebar.classList.toggle("collapsed");
	sidebarToggle.textContent = sidebar.classList.contains("collapsed") ? "›" : "‹";
});

// keep the panel right below the UI bar, which changes height when it wraps
new ResizeObserver(() => {
	document.documentElement.style.setProperty("--ui-h", document.getElementById("ui").offsetHeight + "px");
}).observe(document.getElementById("ui"));

// ---------- start ----------
buildList();
syncList();
createElements();
updateSortButton();
updateReverseButton();
applySort();
applyView();
</script>
</body>
</html>
